<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Admin Login</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

<div class="login-box">

    <h2>Admin Login</h2>

    <input
        type="email"
        id="email"
        placeholder="Email">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button onclick="login()">
        Login
    </button>

    <p id="message"></p>

</div>

<script src="login.js"></script>

</body>
</html>
